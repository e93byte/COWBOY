<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">COWBOY free picks panel</title>
  <desc id="desc">Mock free-picks interface showing current pick selection and saved entry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d10"/>
      <stop offset="1" stop-color="#16120f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#201b17"/>
      <stop offset="1" stop-color="#181511"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b57e"/>
      <stop offset="1" stop-color="#d57d4f"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="240" y="120" width="960" height="760" rx="24" fill="#171a1d" stroke="#8d6a4c"/>
    <text x="288" y="202" fill="#f8f3ef" font-family="Arial, sans-serif" font-size="54" font-weight="700">Your pick</text>
    <text x="1110" y="196" fill="#d5c5b6" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">FREE ENTRY</text>
    <rect x="288" y="236" width="864" height="110" rx="16" fill="#2a2320" stroke="#8f6948"/>
    <text x="324" y="286" fill="#f5e7d5" font-family="Arial, sans-serif" font-size="20">ATP</text>
    <text x="324" y="316" fill="#f6f1eb" font-family="Arial, sans-serif" font-size="24" font-weight="700">Marcelo Arevalo / Mate Pavic vs Harri Heliovaara / Henry Patten</text>
    <rect x="288" y="376" width="864" height="84" rx="16" fill="#221d1a" stroke="#807063"/>
    <text x="324" y="426" fill="#f6f1eb" font-family="Arial, sans-serif" font-size="20">Free pick saved</text>
    <rect x="288" y="488" width="864" height="182" rx="18" fill="#1a1e21" stroke="#4d423a"/>
    <text x="328" y="534" fill="#f7f1ea" font-family="Arial, sans-serif" font-size="22" font-weight="700">PICK</text>
    <text x="328" y="588" fill="#f7f1ea" font-family="Arial, sans-serif" font-size="28" font-weight="700">Marcelo Arevalo / Mate Pavic</text>
    <text x="328" y="636" fill="#f7f1ea" font-family="Arial, sans-serif" font-size="22">Nov 17, 4:30 AM CST</text>
    <rect x="288" y="692" width="864" height="116" rx="20" fill="url(#panel)"/>
    <text x="328" y="746" fill="#f7f1ea" font-family="Arial, sans-serif" font-size="22">Your free pick is ready.</text>
    <rect x="928" y="710" width="180" height="54" rx="14" fill="url(#orange)"/>
    <text x="1018" y="746" text-anchor="middle" fill="#241914" font-size="18" font-family="Arial, sans-serif" font-weight="700">Review entry</text>
  </g>
</svg>
